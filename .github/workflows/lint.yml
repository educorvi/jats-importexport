name: Lint and Test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Install dependencies
        run: make install

      - name: Ruff lint
        run: make lint

      - name: Ruff format
        run: make format-check

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test
