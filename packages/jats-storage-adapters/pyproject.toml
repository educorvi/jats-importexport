[project]
name = "jats-storage-adapters"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "jats_classes",
    "lxml"
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "ty>=0.0.40",
]

[project.scripts]
jats-plone = "jats_storage_adapters.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "uvc-plone"
url = "https://pypi.bg-kooperation.de"

[tool.uv.sources]
jats_classes = {workspace = true}