[project]
name = "jats-importexport"
version = "0.1.0"
description = "Add your description here"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "markdownify>=1.2.2",
    "redis>=8.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "ty>=0.0.40",
    "pre-commit>=4.6.0",
    "openapi-generator-cli",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "zest.releaser[recommended]"
]

[tool.uv.workspace]
members = ["packages/*","applications/*"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    "**/tests/*",
    "**/test/*",
    "packages/api-client"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ty.src]
exclude = [
    "packages/api-client",
    "**/tests/*",
    "**/test/*",
]

[tool.ty.environment]
python-version = "3.13"

[tool.uv.sources]
jats_classes = {workspace = true}
