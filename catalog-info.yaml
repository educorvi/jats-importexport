apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: jats-importexport
  title: Import/Export Hub
  description: Upload, parse, convert, and store JATS XML documents.
  annotations:
    github.com/project-slug: educorvi/jats-importexport
  tags:
    - python
    - fastapi
    - jats
spec:
  type: service
  system: vorschriften-und-regeln
  lifecycle: experimental
  owner: group:default/developers
  providesApis:
    - jats-importexport-api
  consumesApis:
    - vur-plone-rest-api
    - api:default/api-key-manager
  dependsOn:
    - resource:default/vur-demo
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: jats-importexport-api
  title: JATS Import/Export API
  description: REST API for uploading, storing, and exporting JATS documents.
spec:
  type: openapi
  system: vorschriften-und-regeln
  lifecycle: experimental
  owner: group:default/developers
  definition:
    $text: ./applications/api/openapi.json
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: jats-importexport-client
  title: JATS Import/Export API Client
  description: Generated Python client for the JATS Import/Export REST API.
  annotations:
    github.com/project-slug: educorvi/jats-importexport
    backstage.io/source-location: url:https://github.com/educorvi/jats-importexport/tree/main/packages/api-client
  tags:
    - python
    - openapi
    - jats
spec:
  type: library
  system: vorschriften-und-regeln
  lifecycle: experimental
  owner: group:default/developers
